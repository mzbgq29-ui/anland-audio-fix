name: ARM64 audio root fixes
on:
  workflow_dispatch:
  push:
    paths:
      - cloud-build.sh
      - '*.patch'
      - prepare_recipes.py
      - verify_packages.py
      - .github/workflows/cloud-build.yml
permissions:
  contents: read
jobs:
  arch-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build in official Arch Linux ARM rootfs
        run: bash cloud-build.sh
      - name: Upload packages, rollback files and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anland-audio-archlinuxarm-aarch64
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
